<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BFO</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #0a0a0a; color: #e5e7eb; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(24px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
      img { width: 76px; height: 76px; border-radius: 18px; }
      h1 { margin: 6px 0 0; font-size: 19px; font-weight: 600; color: #fff; }
      p { margin: 0; color: #9ca3af; max-width: 320px; }
      button { margin-top: 10px; height: 48px; padding: 0 26px; border-radius: 9999px; border: 0; background: #fff; color: #000; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon-192.png" alt="" />
      <h1>Opening BFO</h1>
      <p>One moment.</p>
      <button type="button" onclick="go()">Try again</button>
    </main>
    <script>
      // The app's pages live on the site; this page is only the shell's fallback (capacitor.config.ts).
      var SITE = "https://www.burtonfamilyoffice.com/home";
      function go() { location.href = SITE; }
      window.addEventListener("online", go);
      go();
    </script>
  </body>
</html>
