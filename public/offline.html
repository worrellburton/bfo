<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>BFO - Offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #000; color: #e5e7eb; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 6px 0 0; font-size: 18px; font-weight: 600; color: #fff; }
      p { margin: 0; color: #9ca3af; max-width: 320px; }
      button { margin-top: 8px; height: 38px; padding: 0 18px; border-radius: 9999px; border: 0; background: #fff; color: #000; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>BFO needs a connection. It will pick up where you left off as soon as you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
