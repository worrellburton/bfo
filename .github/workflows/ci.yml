# Checks every pull request and every push to main: types, lint, tests, build.
# Same Node and cache setup as ios-testflight.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `react-router typegen && tsc` — typegen writes .react-router/types first.
      - run: npm run typecheck

      # eslint.config.js. ESLint isn't in devDependencies yet (add it with
      # `npm i -D eslint @eslint/js typescript-eslint eslint-plugin-react-hooks eslint-plugin-react-refresh globals`
      # and drop the install line here); until then it's fetched for the run.
      - name: Lint
        run: |
          if [ ! -x node_modules/.bin/eslint ]; then
            npm i --no-save eslint@9 @eslint/js@9 typescript-eslint@8 eslint-plugin-react-hooks@5 eslint-plugin-react-refresh@0.4 globals@15
          fi
          npm run lint

      - run: npm test

      - run: npm run build

  # The app in a real browser: every route at phone, iPad and desktop widths,
  # an accessibility pass, and the flows that must keep working (e2e/run.cjs).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      # The production bundle, served as Vercel serves it (SPA fallback), so the
      # checks see what ships. The dev server's on-the-fly dependency
      # optimization reloads pages mid-check on a cold runner.
      - run: npm run build
      - name: Serve the build
        run: |
          npx vite preview --outDir build/client --host 127.0.0.1 --port 5173 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
      - run: BASE=http://127.0.0.1:5173 npm run e2e
      - if: failure()
        run: tail -50 serve.log
