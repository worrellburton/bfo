# Checks every pull request and every push to main: types, lint, formatting,
# tests with a coverage floor, a production audit of the dependencies, the
# build, and the app in a real browser (e2e/run.cjs). Same Node and cache
# setup as ios-testflight.yml. deploy-check.yml runs after a merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # `react-router typegen && tsc` — typegen writes .react-router/types first.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # vitest with the coverage floor from vite.config.ts (the run fails under it).
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; console.log('lines ' + t.lines.pct + '%  functions ' + t.functions.pct + '%  branches ' + t.branches.pct + '%')" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Known vulnerabilities in what ships (devDependencies don't ship).
      - run: npm run audit

      - run: npm run build

  # The app in a real browser: every route at phone, iPad and desktop widths,
  # an accessibility pass, and the flows that must keep working (e2e/run.cjs).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Chromium is cached by Playwright version, so a run doesn't download it.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium

      # The production bundle, served as Vercel serves it (SPA fallback), so the
      # checks see what ships. The dev server's on-the-fly dependency
      # optimization reloads pages mid-check on a cold runner.
      - run: npm run build
      - name: Serve the build
        run: |
          npx vite preview --outDir build/client --host 127.0.0.1 --port 5173 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
      - run: BASE=http://127.0.0.1:5173 npm run e2e
      - if: failure()
        run: tail -50 serve.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures
          path: e2e/out/
          if-no-files-found: ignore
          retention-days: 7
