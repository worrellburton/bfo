# Builds the iPhone app (ios/, capacitor.config.ts) on a cloud Mac and uploads it
# to App Store Connect, where it appears in TestFlight. Run it from the Actions tab
# ("iOS → TestFlight" → Run workflow) after a change to the native shell; changes
# to the site itself reach the app without a new build.
#
# Repository secrets it needs (docs/ios-app.md walks through getting them):
#   APPLE_TEAM_ID   the 10-character Team ID from developer.apple.com → Membership
#   ASC_KEY_ID      an App Store Connect API key's Key ID (Users and Access → Integrations)
#   ASC_ISSUER_ID   that page's Issuer ID
#   ASC_KEY_P8      the key's .p8 file, its whole text
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (e.g. 1.0.1). Leave blank to keep the project's."
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # App Store Connect only takes builds made with the current Xcode and iOS SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - name: Copy the shell's web files and plugins into the Xcode project
        run: npx cap sync ios

      - name: Check the secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/ios-app.md)"
            exit 1
          fi

      - name: Write the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuilt as a proper PEM whatever the paste lost: line breaks, the
          # BEGIN/END lines, or stray spaces and quotes around it.
          body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n"')
          if ! printf '%s' "$body" | base64 --decode > /dev/null 2>&1 || [ "${#body}" -lt 100 ] || [ "${#body}" -gt 400 ]; then
            echo "::error::ASC_KEY_P8 isn't the text of an App Store Connect .p8 key (${#body} characters of key data). Paste the whole file, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----."
            exit 1
          fi
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s\n' "$body" | fold -w 64
            echo "-----END PRIVATE KEY-----"
          } > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # Must parse as an EC private key, or Xcode refuses it.
          if ! openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 doesn't read as a private key. Download the key again (or make a new one) and paste the whole .p8 file."
            exit 1
          fi

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Every upload needs a new build number: the workflow's run number always grows.
          extra=()
          [ -n "$VERSION" ] && extra+=("MARKETING_VERSION=$VERSION")
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BFO.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${extra[@]}"

      - name: Upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BFO.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows in App Store Connect → TestFlight once Apple finishes processing (usually 5–15 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
